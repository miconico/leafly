<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TreeList</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}

    #app{display:flex;flex-direction:column;height:100vh;}

    /* ── Topbar ── */
    #topbar{
      display:flex;align-items:center;gap:10px;padding:0 14px;
      height:52px;min-height:52px;
      background:#1e120a;border-bottom:2px solid #2d1a0d;
    }
    #menu-btn{background:none;border:none;color:rgba(255,255,255,.65);font-size:20px;cursor:pointer;padding:6px;border-radius:8px;line-height:1;}
    #menu-btn:hover{background:rgba(255,255,255,.1);}
    #topbar h1{flex:1;font-size:17px;font-weight:700;color:#f0dfc0;letter-spacing:.2px;}
    #topbar-section-name{font-size:13px;color:#8a6a3a;font-weight:500;}

    /* ── Body ── */
    #body{display:flex;flex:1;overflow:hidden;}

    /* ── Sidebar ── */
    #sidebar{
      width:200px;min-width:200px;background:#130c05;
      display:flex;flex-direction:column;
      border-right:1px solid #2a1608;
      transition:width .22s ease,min-width .22s ease;overflow:hidden;
    }
    #sidebar.collapsed{width:0;min-width:0;}

    #sidebar-hdr{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 12px 10px;border-bottom:1px solid #2a1608;flex-shrink:0;
    }
    #sidebar-hdr span{font-size:10px;color:#5a3a1a;text-transform:uppercase;letter-spacing:.1em;font-weight:700;}
    #add-sec-btn{
      width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.06);
      border:none;color:#7a5030;font-size:19px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;line-height:1;
    }
    #add-sec-btn:hover{background:rgba(255,255,255,.13);color:#c8943a;}

    #sec-list{flex:1;overflow-y:auto;padding:6px 8px 10px;}
    #sec-list::-webkit-scrollbar{width:3px;}
    #sec-list::-webkit-scrollbar-thumb{background:#2a1608;border-radius:2px;}

    .sec-item{
      display:flex;align-items:center;gap:8px;
      padding:11px 8px;border-radius:10px;cursor:pointer;
      margin-bottom:2px;transition:background .1s;
    }
    .sec-item:hover{background:rgba(255,255,255,.05);}
    .sec-item.active{background:rgba(255,220,140,.1);}
    .sec-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
    .sec-label{flex:1;font-size:13px;color:#8a7050;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .sec-item.active .sec-label{color:#f0dfc0;font-weight:600;}
    .sec-count{font-size:10px;color:#4a3018;background:rgba(255,255,255,.05);padding:2px 6px;border-radius:10px;flex-shrink:0;}
    .sec-item.active .sec-count{color:#9a7040;background:rgba(255,220,140,.1);}
    .sec-acts{display:flex;gap:2px;flex-shrink:0;}
    .sec-btn{background:none;border:none;color:#4a3018;font-size:13px;cursor:pointer;padding:3px 5px;border-radius:5px;line-height:1;}
    .sec-btn:hover{color:#c8943a;background:rgba(255,255,255,.08);}
    .sec-item:not(:hover) .sec-acts{display:none;}
    .sec-inp{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:#f0dfc0;padding:3px 8px;font-size:13px;font-family:inherit;outline:none;}

    /* ── Main ── */
    #main{flex:1;overflow-y:auto;overflow-x:hidden;background:#f4efe4;position:relative;}
    #main::-webkit-scrollbar{width:4px;}
    #main::-webkit-scrollbar-thumb{background:#c8b48a;border-radius:2px;}

    /* ── Empty ── */
    #empty-msg{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:100%;color:#b8a070;text-align:center;gap:14px;padding:40px;
    }
    #empty-msg .ico{font-size:58px;}
    #empty-msg p{font-size:14px;line-height:1.7;color:#a09060;}

    /* ── Tree outer container ── */
    #tree-outer{position:relative;padding:0 0 80px;}

    /* SVG behind everything — pointer-events on for trunk tap */
    #tree-svg{position:absolute;top:0;left:0;z-index:1;}

    /* Trunk tap hint */
    #trunk-hint{
      position:absolute;left:50%;transform:translateX(-50%);
      font-size:10px;color:#c8a870;opacity:.7;
      pointer-events:none;z-index:3;white-space:nowrap;
      letter-spacing:.04em;
    }

    /* ── Keyword editor panel ── */
    #kw-panel{
      position:fixed;z-index:200;
      background:#2a1608;border:1px solid #4a2e14;
      border-radius:16px;padding:14px;
      box-shadow:0 8px 32px rgba(0,0,0,.4);
      width:220px;display:none;
    }
    #kw-panel h3{font-size:11px;color:#8a6030;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:10px;}
    #kw-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;min-height:24px;}
    .kw-chip{
      display:flex;align-items:center;gap:4px;
      background:#3d1e08;border:1px solid #6a3a18;
      border-radius:20px;padding:4px 8px 4px 10px;
      font-size:11px;color:#f0c880;font-weight:600;
      letter-spacing:.03em;
    }
    .kw-chip-del{
      background:none;border:none;color:#8a5030;
      font-size:14px;cursor:pointer;line-height:1;padding:0 1px;
    }
    .kw-chip-del:hover{color:#e07040;}
    #kw-inp-row{display:flex;gap:6px;}
    #kw-inp{
      flex:1;background:#1a0c04;border:1px solid #4a2e14;
      border-radius:10px;padding:7px 10px;
      font-size:12px;font-family:inherit;color:#f0dfc0;
      outline:none;
    }
    #kw-inp:focus{border-color:#8b6030;}
    #kw-inp::placeholder{color:#4a3018;}
    #kw-add-btn{
      padding:7px 11px;background:#5c3318;color:#f0dfc0;
      border:none;border-radius:10px;font-size:13px;
      cursor:pointer;font-family:inherit;font-weight:700;
    }
    #kw-add-btn:hover{background:#7a4a24;}
    #kw-close{
      display:block;width:100%;margin-top:10px;
      padding:6px;background:transparent;
      border:1px solid #3a2010;border-radius:10px;
      color:#6a4828;font-size:11px;cursor:pointer;font-family:inherit;
    }
    #kw-close:hover{background:#1a0c04;color:#a07040;}

    /* Tree section title */
    #tree-title{
      text-align:center;padding:20px 16px 14px;
      position:relative;z-index:2;
    }
    #tree-title h2{font-size:20px;font-weight:800;color:#2c1a08;letter-spacing:.2px;}
    #tree-title p{font-size:12px;color:#9a7850;margin-top:4px;}

    /* ── Leaf layout ── */
    #leaves-wrap{position:relative;z-index:2;padding:0 0 20px;}

    .leaf-row{
      display:flex;align-items:center;margin:10px 0;min-height:170px;
    }
    .leaf-slot{flex:1;padding:0;}
    .leaf-slot.left{display:flex;justify-content:flex-end;}
    .leaf-slot.right{display:flex;justify-content:flex-start;}
    .leaf-slot.empty{pointer-events:none;}
    .trunk-gap{width:48px;flex-shrink:0;}

    /* ── Leaf card ── */
    .leaf-card{
      width:100%;max-width:200px;
      background:white;border-radius:18px;
      box-shadow:0 3px 14px rgba(0,0,0,.09);
      overflow:hidden;
      border:2px solid var(--lc,#27ae60);
    }

    .leaf-head{
      display:flex;align-items:center;gap:7px;
      padding:9px 10px;
      background:var(--lc-light,#e8f5e9);
      border-bottom:1px solid rgba(0,0,0,.06);
    }
    .leaf-head-icon{font-size:14px;flex-shrink:0;}
    .leaf-head-title{
      flex:1;font-size:12px;font-weight:700;
      color:var(--lc-dark,#1b5e20);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      cursor:pointer;
    }
    .leaf-head-count{
      font-size:10px;background:white;
      color:var(--lc,#27ae60);
      padding:1px 6px;border-radius:10px;flex-shrink:0;font-weight:600;
    }
    .leaf-del-btn{
      background:none;border:none;color:rgba(0,0,0,.2);
      font-size:15px;cursor:pointer;padding:2px 3px;border-radius:5px;flex-shrink:0;line-height:1;
    }
    .leaf-del-btn:hover{color:#c0392b;background:rgba(192,57,43,.1);}

    .leaf-pin-btn{
      background:none;border:none;color:rgba(0,0,0,.18);
      font-size:13px;cursor:pointer;padding:2px 4px;
      border-radius:5px;flex-shrink:0;line-height:1;transition:all .12s;
    }
    .leaf-pin-btn:hover{color:#d4880a;background:rgba(212,136,10,.1);}
    .leaf-pin-btn.pinned{color:#d4880a;}

    .leaf-body{padding:7px 8px;}

    .leaf-todo{
      display:flex;align-items:flex-start;gap:7px;
      padding:5px 3px;border-radius:8px;
      min-height:36px;
    }
    .leaf-todo:hover{background:#f8f6f0;}

    .leaf-chk{
      width:20px;height:20px;border-radius:6px;
      border:2px solid #d8d0c0;flex-shrink:0;margin-top:1px;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:all .15s;
    }
    .leaf-chk.done{background:var(--lc,#27ae60);border-color:transparent;}
    .leaf-chk.done::after{content:'✓';font-size:12px;font-weight:800;color:white;}

    .leaf-todo-txt{
      flex:1;font-size:12px;color:#2c2010;line-height:1.45;
      word-break:break-word;min-width:0;
    }
    .leaf-todo-txt.done{text-decoration:line-through;color:#bfb090;}
    .leaf-todo-txt-inp{
      flex:1;border:none;outline:none;font-size:12px;
      font-family:inherit;color:#2c2010;background:transparent;padding:0;width:100%;
    }

    .leaf-todo-del{
      background:none;border:none;color:#e0d0b0;font-size:14px;
      cursor:pointer;padding:2px 3px;border-radius:5px;
      flex-shrink:0;opacity:0;transition:opacity .1s;line-height:1;
    }
    .leaf-todo:hover .leaf-todo-del{opacity:1;}
    .leaf-todo-del:hover{color:#c0392b;background:#fff0ee;}

    .leaf-add-row{
      display:flex;gap:4px;padding:5px 3px;
      border-top:1px solid #f0e8d8;margin-top:3px;
    }
    .leaf-add-inp{
      flex:1;border:1px solid #e8dfc8;border-radius:8px;
      padding:5px 8px;font-size:11px;font-family:inherit;
      outline:none;background:#faf8f4;color:#2c2010;min-width:0;
    }
    .leaf-add-inp:focus{border-color:var(--lc,#27ae60);background:white;}
    .leaf-add-inp::placeholder{color:#c0b080;}
    .leaf-add-btn{
      padding:5px 9px;background:var(--lc,#27ae60);color:white;
      border:none;border-radius:8px;font-size:11px;cursor:pointer;
      font-family:inherit;font-weight:700;flex-shrink:0;
    }

    /* ── Ground / roots area ── */
    #tree-ground{
      display:flex;justify-content:center;align-items:flex-end;
      padding:0 0 10px;position:relative;z-index:2;height:50px;
    }

    /* ── FAB ── */
    #add-leaf-btn{
      position:fixed;right:16px;bottom:20px;
      background:#3d6b2e;color:white;border:none;
      padding:13px 18px;border-radius:50px;
      font-size:14px;font-weight:700;cursor:pointer;
      font-family:inherit;
      box-shadow:0 4px 16px rgba(40,80,20,.35);
      transition:all .15s;z-index:50;display:none;
    }
    #add-leaf-btn:hover{background:#2d5020;transform:translateY(-2px);}
    #add-leaf-btn:active{transform:none;}

    /* ── Leaf name editor ── */
    .leaf-name-inp{
      flex:1;border:none;background:transparent;outline:none;
      font-size:12px;font-weight:700;font-family:inherit;
      color:var(--lc-dark,#1b5e20);padding:0;min-width:0;
    }

    /* ════════════════════════════════
       VISION BOARD
    ════════════════════════════════ */

    /* Sidebar vision entry */
    #vb-entry{
      display:flex;align-items:center;gap:9px;
      padding:12px 10px;margin:8px 8px 0;
      border-radius:10px;cursor:pointer;
      border:1px solid #2a1608;
      background:rgba(255,220,100,.05);
      transition:background .12s;flex-shrink:0;
    }
    #vb-entry:hover{background:rgba(255,220,100,.1);}
    #vb-entry.active{background:rgba(255,220,100,.15);border-color:#5a3a10;}
    #vb-entry-icon{font-size:16px;flex-shrink:0;}
    #vb-entry-label{font-size:13px;color:#a08040;font-weight:600;flex:1;}
    #vb-entry.active #vb-entry-label{color:#f0c860;}
    #vb-entry-count{font-size:10px;color:#5a3a10;background:rgba(255,200,80,.1);padding:2px 7px;border-radius:10px;}
    .sidebar-divider-line{height:1px;background:#1e1008;margin:8px 10px 4px;}

    /* Vision board main area */
    #vb-outer{
      min-height:100%;background:#fdf8ee;
      padding:0 0 100px;
    }
    #vb-header{
      padding:20px 18px 16px;
      border-bottom:1px solid #e8dfc8;
      background:#fdf8ee;
    }
    #vb-header h2{font-size:20px;font-weight:800;color:#2c1a08;}
    #vb-header p{font-size:12px;color:#9a7850;margin-top:3px;}

    /* Keyword card grid */
    #vb-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      padding:14px 12px;
    }

    .vb-card{
      background:white;border-radius:16px;
      border:2px solid var(--vc,#d4880a);
      box-shadow:0 2px 10px rgba(0,0,0,.07);
      overflow:hidden;display:flex;flex-direction:column;
    }

    .vb-card-head{
      display:flex;align-items:center;gap:6px;
      padding:10px 10px 9px;
      background:var(--vc-light,#fff5e0);
      border-bottom:1px solid rgba(0,0,0,.06);
      flex-shrink:0;
    }
    .vb-card-icon{font-size:14px;flex-shrink:0;}
    .vb-card-title{
      flex:1;font-size:13px;font-weight:800;
      color:var(--vc-dark,#7a4f00);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      cursor:pointer;letter-spacing:.02em;text-transform:uppercase;
    }
    .vb-card-title-inp{
      flex:1;border:none;background:transparent;outline:none;
      font-size:13px;font-weight:800;font-family:inherit;
      color:var(--vc-dark,#7a4f00);padding:0;min-width:0;
      text-transform:uppercase;letter-spacing:.02em;
    }
    .vb-card-btn{
      background:none;border:none;color:rgba(0,0,0,.22);
      font-size:14px;cursor:pointer;padding:2px 4px;
      border-radius:5px;line-height:1;flex-shrink:0;
    }
    .vb-card-btn:hover{color:var(--vc-dark,#7a4f00);background:rgba(0,0,0,.07);}
    .vb-card-btn.danger:hover{color:#c0392b;background:rgba(192,57,43,.1);}

    .vb-card-body{
      flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:6px;
    }

    /* Content textarea */
    .vb-content{
      width:100%;min-height:60px;resize:none;border:none;
      outline:none;font-size:12px;font-family:inherit;
      color:#3a2810;line-height:1.6;background:transparent;
      padding:0;
    }
    .vb-content::placeholder{color:#c8b88a;font-style:italic;}

    /* Plant as tree button */
    .vb-plant-btn{
      display:flex;align-items:center;gap:5px;
      padding:6px 10px;border-radius:10px;
      background:var(--vc-light,#fff5e0);
      border:1px solid var(--vc,#d4880a);
      color:var(--vc-dark,#7a4f00);font-size:11px;
      font-weight:700;cursor:pointer;font-family:inherit;
      transition:all .12s;margin-top:2px;
      justify-content:center;
    }
    .vb-plant-btn:hover{background:var(--vc,#d4880a);color:white;}

    /* Add keyword FAB (vision mode) */
    #add-kw-fab{
      position:fixed;right:16px;bottom:20px;
      background:#8a6010;color:#f5e0a0;border:none;
      padding:13px 18px;border-radius:50px;
      font-size:14px;font-weight:700;cursor:pointer;
      font-family:inherit;
      box-shadow:0 4px 16px rgba(100,60,0,.35);
      transition:all .15s;z-index:50;display:none;
    }
    #add-kw-fab:hover{background:#6a4808;transform:translateY(-2px);}
    #add-kw-fab:active{transform:none;}

    /* VB empty state */
    #vb-empty{
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;padding:60px 30px;gap:12px;text-align:center;
    }
    #vb-empty .ico{font-size:52px;}
    #vb-empty p{font-size:13px;color:#b09860;line-height:1.7;}

    /* ── Leaf rename button ── */
    .leaf-rename-btn{
      background:none;border:none;color:rgba(0,0,0,.25);
      font-size:12px;cursor:pointer;padding:2px 4px;
      border-radius:5px;flex-shrink:0;line-height:1;
      transition:color .1s,background .1s;
    }
    .leaf-rename-btn:hover{color:var(--lc-dark,#1b5e20);background:rgba(0,0,0,.07);}

    /* ── Todo drag handle ── */
    .leaf-drag-handle{
      color:#d8ccb8;font-size:15px;cursor:grab;
      padding:2px 2px;flex-shrink:0;line-height:1;
      touch-action:none;user-select:none;
    }
    .leaf-drag-handle:active{cursor:grabbing;}
    .leaf-todo:hover .leaf-drag-handle{color:#a09070;}

    /* ── Drag states ── */
    .leaf-todo.is-dragging{opacity:.3;}
    .leaf-todo.drop-before{border-top:2.5px solid var(--lc,#27ae60);border-radius:4px 4px 8px 8px;}
    .leaf-todo.drop-after{ border-bottom:2.5px solid var(--lc,#27ae60);border-radius:8px 8px 4px 4px;}
    /* ── Auth overlay ── */
    #auth-overlay{
      position:fixed;inset:0;z-index:1000;background:#1e120a;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
    }
    #auth-overlay.hidden{display:none;}
    #auth-card{
      background:#fdf8ee;border-radius:24px;padding:36px 32px 32px;
      width:min(360px,90vw);text-align:center;
      box-shadow:0 12px 48px rgba(0,0,0,.4);
    }
    #auth-logo{font-size:52px;margin-bottom:12px;}
    #auth-card h1{font-size:24px;font-weight:800;color:#2c1a08;margin-bottom:6px;}
    #auth-card p{font-size:13px;color:#9a7850;line-height:1.6;margin-bottom:28px;}
    #auth-google-btn{
      display:flex;align-items:center;justify-content:center;gap:10px;
      width:100%;padding:13px 20px;background:white;
      border:2px solid #e8dfc8;border-radius:14px;cursor:pointer;
      font-size:15px;font-weight:600;color:#2c1a08;font-family:inherit;
      transition:all .15s;box-shadow:0 2px 8px rgba(0,0,0,.06);
    }
    #auth-google-btn:hover{background:#f5f0e8;border-color:#c8b48a;transform:translateY(-1px);}
    #auth-google-btn svg{width:20px;height:20px;flex-shrink:0;}
    #auth-error{margin-top:14px;font-size:12px;color:#c0392b;min-height:18px;}
    #auth-guest-btn{
      margin-top:14px;background:none;border:none;font-size:12px;
      color:#b09860;cursor:pointer;font-family:inherit;text-decoration:underline;
    }
    #auth-guest-btn:hover{color:#8a6030;}
    /* ── User button ── */
    #user-btn{
      display:none;align-items:center;gap:6px;
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
      border-radius:20px;padding:4px 10px 4px 5px;
      cursor:pointer;transition:background .12s;flex-shrink:0;
    }
    #user-btn.visible{display:flex;}
    #user-btn:hover{background:rgba(255,255,255,.15);}
    #user-avatar{
      width:26px;height:26px;border-radius:50%;background:#5c3318;
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:700;color:#f0dfc0;overflow:hidden;flex-shrink:0;
    }
    #user-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
    #user-name{font-size:11px;color:rgba(255,255,255,.7);
      max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    /* ── Sync dot ── */
    #sync-dot{
      width:7px;height:7px;border-radius:50%;background:#27ae60;
      flex-shrink:0;transition:background .3s;display:none;
    }
    #sync-dot.visible{display:block;}
    #sync-dot.syncing{background:#f39c12;animation:pulse .8s infinite;}
    #sync-dot.error{background:#e74c3c;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  </style>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut, onAuthStateChanged }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, setDoc }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

<script>
(function(){

/* ── Colors ── */
const SEC_COLORS = ['#3d8b37','#c0392b','#d4880a','#2471a3','#7d3c98','#0e7a6b','#b03a6b','#1a5c8a'];

function lighten(hex, amt) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(r+(255-r)*amt)},${Math.round(g+(255-g)*amt)},${Math.round(b+(255-b)*amt)})`;
}
function darken(hex, amt) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(r*(1-amt))},${Math.round(g*(1-amt))},${Math.round(b*(1-amt))})`;
}

let state = { sections:[], activeId:null, nextId:1, activeView:'tree', visionBoard:{ keywords:[] } };

/* ── Storage ── Firestore → Capacitor Preferences → localStorage ── */
const STORE_KEY = 'treelist_v1';
let   currentUser = null;

function setSyncDot(st) {
  const dot = document.getElementById('sync-dot');
  if (!dot) return;
  dot.className = currentUser ? `visible ${st}` : '';
}

async function firestoreGet(uid) {
  try {
    const { db, doc, getDoc } = window._fb;
    const snap = await getDoc(doc(db, 'users', uid, 'data', 'state'));
    return snap.exists() ? JSON.stringify(snap.data()) : null;
  } catch(e) { console.warn('Firestore get failed', e); return null; }
}

async function firestoreSet(uid, value) {
  const { db, doc, setDoc } = window._fb;
  await setDoc(doc(db, 'users', uid, 'data', 'state'), JSON.parse(value));
}

async function storageGet() {
  if (currentUser && window._fb) return firestoreGet(currentUser.uid);
  try {
    if (window.Capacitor?.Plugins?.Preferences) {
      const { value } = await window.Capacitor.Plugins.Preferences.get({ key: STORE_KEY });
      return value;
    }
  } catch(e) {}
  return localStorage.getItem(STORE_KEY);
}

async function storageSet(value) {
  if (currentUser && window._fb) {
    setSyncDot('syncing');
    try {
      await firestoreSet(currentUser.uid, value);
      setSyncDot('');
    } catch(e) {
      setSyncDot('error');
      localStorage.setItem(STORE_KEY, value);
    }
    return;
  }
  try {
    if (window.Capacitor?.Plugins?.Preferences) {
      await window.Capacitor.Plugins.Preferences.set({ key: STORE_KEY, value });
      return;
    }
  } catch(e) {}
  localStorage.setItem(STORE_KEY, value);
}

async function pinLeafToWidget(leafId) {
  state.pinnedLeafId = (state.pinnedLeafId === leafId) ? null : leafId;
  save();
  const val = state.pinnedLeafId !== null ? String(state.pinnedLeafId) : '';
  try {
    if (window.Capacitor?.Plugins?.Preferences)
      await window.Capacitor.Plugins.Preferences.set({ key: 'treelist_pinned_leaf', value: val });
    else localStorage.setItem('treelist_pinned_leaf', val);
  } catch(e) {}
}

function save() {
  storageSet(JSON.stringify(state)).catch(e => console.warn('Save failed', e));
}

function seed() {
  function mkSec(name, color, leaves) {
    const s = { id: state.nextId++, name, color, leaves: [] };
    leaves.forEach(l => {
      const leaf = { id: state.nextId++, name: l.name, todos: [] };
      (l.todos||[]).forEach(t => leaf.todos.push({id:state.nextId++, text:t, done:false}));
      s.leaves.push(leaf);
    });
    state.sections.push(s); return s;
  }
  const s1 = mkSec('Work', '#2471a3', [
    { name:'This week',   todos:['Finish project report','Team standup call','Review PRs'] },
    { name:'In progress', todos:['Refactor auth module','Update staging env'] },
    { name:'Follow-ups',  todos:['Email client re: timeline','Chase invoice #204'] },
  ]);
  s1.keywords = ['Focus','Deliver','Grow'];
  mkSec('Personal', '#3d8b37', [
    { name:'Health',   todos:['Book dentist appointment','Morning run 3×/wk'] },
    { name:'Home',     todos:['Fix leaking tap','Order new shelf','Tidy garage'] },
    { name:'Finance',  todos:['Pay insurance','Review subscriptions'] },
  ]).keywords = ['Balance','Peace','Thrive'];
  mkSec('Projects', '#7d3c98', [
    { name:'Research',  todos:['Read Atomic Habits ch.4','Watch design talk'] },
    { name:'Build',     todos:['Prototype v2 UI','Write README'] },
  ]).keywords = ['Create','Explore'];
  state.activeId = s1.id;
  state.visionBoard = { keywords: [
    { id: state.nextId++, title:'Health', color:'#27ae60', content:'Move every day. Sleep 8 hours. Eat whole foods. Energy is everything.' },
    { id: state.nextId++, title:'Growth', color:'#2471a3', content:'Read daily. Embrace discomfort. Every mistake is a lesson.' },
    { id: state.nextId++, title:'Freedom', color:'#7d3c98', content:'Build systems that work without me. Time over money.' },
    { id: state.nextId++, title:'Creativity', color:'#d4880a', content:'Make something every week. Share it even when it feels unfinished.' },
  ]};
}

function activeSec() { return state.sections.find(s=>s.id===state.activeId)||null; }

/* ── Sidebar ── */
const secListEl  = document.getElementById('sec-list');
const topSecName = document.getElementById('topbar-section-name');
const vbEntry    = document.getElementById('vb-entry');
const vbCount    = document.getElementById('vb-entry-count');
const addKwFab   = document.getElementById('add-kw-fab');

function renderSidebar() {
  vbCount.textContent = state.visionBoard.keywords.length;
  vbEntry.classList.toggle('active', state.activeView === 'vision');

  secListEl.innerHTML = '';
  state.sections.forEach(sec => {
    const total = sec.leaves.reduce((n,l)=>n+l.todos.filter(t=>!t.done).length,0);
    const el = document.createElement('div');
    el.className = 'sec-item' + (sec.id===state.activeId && state.activeView==='tree' ? ' active':'');
    el.dataset.id = sec.id;
    el.innerHTML = `
      <div class="sec-dot" style="background:${sec.color}"></div>
      <div class="sec-label">${esc(sec.name)}</div>
      ${total>0?`<div class="sec-count">${total}</div>`:''}
      <div class="sec-acts">
        <button class="sec-btn" data-a="ren">✎</button>
        <button class="sec-btn" data-a="del">×</button>
      </div>`;
    el.addEventListener('click', e => {
      if (e.target.closest('.sec-acts')) return;
      state.activeId = sec.id; state.activeView = 'tree'; save(); render();
    });
    el.querySelector('[data-a="ren"]').addEventListener('click', e => {
      e.stopPropagation(); startRenameSec(sec.id, el);
    });
    el.querySelector('[data-a="del"]').addEventListener('click', e => {
      e.stopPropagation();
      const leafCount = sec.leaves.reduce((n,l)=>n+l.todos.length,0);
      if (leafCount && !confirm(`Delete "${sec.name}"? It has ${sec.leaves.length} leaf/leaves.`)) return;
      state.sections = state.sections.filter(s=>s.id!==sec.id);
      if (state.activeId===sec.id) state.activeId = state.sections[0]?.id||null;
      save(); render();
    });
    secListEl.appendChild(el);
  });
}

function startRenameSec(id, el) {
  const sec = state.sections.find(s=>s.id===id);
  const lbl = el.querySelector('.sec-label');
  const inp = document.createElement('input');
  inp.className = 'sec-inp'; inp.value = sec.name;
  lbl.replaceWith(inp); inp.focus(); inp.select();
  const done = () => { const v=inp.value.trim(); if(v) sec.name=v; save(); renderSidebar(); };
  inp.addEventListener('blur', done);
  inp.addEventListener('keydown', e => { if(e.key==='Enter') inp.blur(); if(e.key==='Escape'){inp.value=sec.name;inp.blur();} });
}

/* ── Vision board entry click ── */
vbEntry.addEventListener('click', () => {
  state.activeView = 'vision'; save(); render();
});

/* ── Main renderer ── */
const mainContent = document.getElementById('main-content');
const addLeafBtn  = document.getElementById('add-leaf-btn');

function render() {
  renderSidebar();
  if (state.activeView === 'vision') {
    topSecName.textContent = 'Vision Board';
    addLeafBtn.style.display = 'none';
    addKwFab.style.display   = 'block';
    renderVisionBoard();
    return;
  }
  addKwFab.style.display = 'none';
  const sec = activeSec();
  topSecName.textContent = sec ? sec.name : '';
  addLeafBtn.style.display = sec ? 'block' : 'none';
  if (!sec) {
    mainContent.innerHTML = `
      <div id="empty-msg">
        <div class="ico">🌱</div>
        <p>Select a tree from the sidebar<br>or tap <strong>+</strong> to plant a new one.</p>
      </div>`;
    return;
  }
  renderTree(sec);
}

/* ════════════════════════════════
   VISION BOARD RENDERER
════════════════════════════════ */
function renderVisionBoard() {
  const vb = state.visionBoard;
  mainContent.innerHTML = `
    <div id="vb-outer">
      <div id="vb-header">
        <h2>✦ Vision Board</h2>
        <p>Your intentions and ideas — tap a keyword to explore it</p>
      </div>
      <div id="vb-grid"></div>
    </div>`;

  const grid = document.getElementById('vb-grid');

  if (!vb.keywords.length) {
    grid.innerHTML = `<div id="vb-empty" style="grid-column:1/-1;">
      <div class="ico">🌟</div>
      <p>Add your first keyword to start capturing your vision.<br>Each keyword can hold notes, intentions, or ideas.</p>
    </div>`;
    return;
  }

  vb.keywords.forEach(kw => {
    const vc      = kw.color || '#d4880a';
    const vcLight = lighten(vc, 0.88);
    const vcDark  = darken(vc, 0.35);

    const card = document.createElement('div');
    card.className = 'vb-card';
    card.style.cssText = `--vc:${vc};--vc-light:${vcLight};--vc-dark:${vcDark}`;

    card.innerHTML = `
      <div class="vb-card-head">
        <span class="vb-card-icon">✦</span>
        <span class="vb-card-title">${esc(kw.title)}</span>
        <button class="vb-card-btn" data-act="ren" title="Rename">✎</button>
        <button class="vb-card-btn danger" data-act="del" title="Delete">×</button>
      </div>
      <div class="vb-card-body">
        <textarea class="vb-content" placeholder="Add notes, intentions, ideas…" rows="4">${esc(kw.content||'')}</textarea>
        <button class="vb-plant-btn" data-act="plant">🌱 Plant as Tree</button>
      </div>`;

    // Auto-resize textarea
    const ta = card.querySelector('.vb-content');
    const resize = () => { ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; };
    ta.addEventListener('input', () => { kw.content = ta.value; save(); resize(); });
    setTimeout(resize, 10);

    // Rename
    const titleEl = card.querySelector('.vb-card-title');
    card.querySelector('[data-act="ren"]').addEventListener('click', () => startRenameKw(kw, titleEl));
    titleEl.addEventListener('click', () => startRenameKw(kw, titleEl));

    // Delete
    card.querySelector('[data-act="del"]').addEventListener('click', () => {
      if (!confirm(`Remove "${kw.title}" from the vision board?`)) return;
      state.visionBoard.keywords = state.visionBoard.keywords.filter(k=>k.id!==kw.id);
      save(); renderVisionBoard(); renderSidebar();
    });

    // Plant as tree
    card.querySelector('[data-act="plant"]').addEventListener('click', () => {
      const exists = state.sections.find(s=>s.name.toLowerCase()===kw.title.toLowerCase());
      if (exists) {
        state.activeId = exists.id; state.activeView = 'tree'; save(); render(); return;
      }
      const color = kw.color || SEC_COLORS[state.sections.length % SEC_COLORS.length];
      const sec = { id:state.nextId++, name:kw.title, color, leaves:[], keywords:[] };
      state.sections.push(sec);
      state.activeId = sec.id; state.activeView = 'tree';
      save(); render();
    });

    grid.appendChild(card);
  });
}

function startRenameKw(kw, titleEl) {
  const inp = document.createElement('input');
  inp.className = 'vb-card-title-inp'; inp.value = kw.title;
  inp.style.cssText = `--vc-dark:${darken(kw.color||'#d4880a',.35)}`;
  titleEl.replaceWith(inp); inp.focus(); inp.select();
  const done = () => {
    const v = inp.value.trim(); if(v) kw.title = v;
    save(); renderVisionBoard();
  };
  inp.addEventListener('blur', done);
  inp.addEventListener('keydown', e => { if(e.key==='Enter') inp.blur(); if(e.key==='Escape'){inp.value=kw.title;inp.blur();} });
}

/* ── Vision board FAB ── */
addKwFab.addEventListener('click', () => {
  const color = SEC_COLORS[state.visionBoard.keywords.length % SEC_COLORS.length];
  const kw = { id: state.nextId++, title: 'New keyword', color, content: '' };
  state.visionBoard.keywords.push(kw);
  save(); renderVisionBoard(); renderSidebar();
  // Focus the new card title
  setTimeout(() => {
    const cards = document.querySelectorAll('.vb-card');
    const last  = cards[cards.length-1];
    if (last) {
      last.scrollIntoView({ behavior:'smooth', block:'center' });
      setTimeout(() => {
        const t = last.querySelector('.vb-card-title');
        if (t) startRenameKw(kw, t);
      }, 160);
    }
  }, 50);
});

function renderTree(sec) {
  mainContent.innerHTML = `
    <div id="tree-outer">
      <svg id="tree-svg"></svg>
      <div id="tree-title">
        <h2>${esc(sec.name)}</h2>
        <p>${sec.leaves.length} leaf/leaves · ${sec.leaves.reduce((n,l)=>n+l.todos.filter(t=>!t.done).length,0)} tasks remaining</p>
      </div>
      <div id="leaves-wrap"></div>
      <div id="tree-ground"></div>
    </div>`;

  const wrap = document.getElementById('leaves-wrap');
  sec.leaves.forEach((leaf, i) => {
    const isLeft = i % 2 === 0;
    const row = document.createElement('div');
    row.className = 'leaf-row ' + (isLeft ? 'left' : 'right');
    row.dataset.lid = leaf.id;

    const lc      = sec.color;
    const lcLight = lighten(lc, 0.88);
    const lcDark  = darken(lc, 0.35);

    const card = document.createElement('div');
    card.className = 'leaf-card';
    card.dataset.lid = leaf.id;
    card.style.cssText = `--lc:${lc};--lc-light:${lcLight};--lc-dark:${lcDark}`;

    const pending = leaf.todos.filter(t=>!t.done).length;
    const isPinned = state.pinnedLeafId === leaf.id;

    card.innerHTML = `
      <div class="leaf-head">
        <span class="leaf-head-icon">🍃</span>
        <span class="leaf-head-title">${esc(leaf.name)}</span>
        ${pending>0?`<span class="leaf-head-count">${pending}</span>`:''}
        <button class="leaf-pin-btn${isPinned?' pinned':''}" title="${isPinned?'Pinned to widget':'Pin to widget'}">📌</button>
        <button class="leaf-rename-btn" title="Rename leaf">✎</button>
        <button class="leaf-del-btn" title="Remove leaf">×</button>
      </div>
      <div class="leaf-body"></div>`;

    // Rename — single tap on ✎ button OR the title itself
    const titleEl  = card.querySelector('.leaf-head-title');
    const renameBtn = card.querySelector('.leaf-rename-btn');
    const doRename = () => startRenameLeaf(leaf, titleEl, sec);
    titleEl.addEventListener('click', doRename);
    renameBtn.addEventListener('click', doRename);

    // Pin to widget
    card.querySelector('.leaf-pin-btn').addEventListener('click', () => {
      pinLeafToWidget(leaf.id);
      renderTree(sec); // re-render so only one pin shows active
    });

    // Delete leaf
    card.querySelector('.leaf-del-btn').addEventListener('click', () => {
      if (leaf.todos.length && !confirm(`Remove leaf "${leaf.name}"?`)) return;
      sec.leaves = sec.leaves.filter(l=>l.id!==leaf.id);
      save(); renderTree(sec); renderSidebar(); setTimeout(drawTreeSVG, 50);
    });

    // Body: todos + add row
    renderLeafBody(card.querySelector('.leaf-body'), leaf, sec);

    const leftSlot  = document.createElement('div');
    leftSlot.className = 'leaf-slot ' + (isLeft ? 'left' : 'empty');
    const trunkGap  = document.createElement('div');
    trunkGap.className = 'trunk-gap';
    const rightSlot = document.createElement('div');
    rightSlot.className = 'leaf-slot ' + (!isLeft ? 'right' : 'empty');

    if (isLeft)  leftSlot.appendChild(card);
    else         rightSlot.appendChild(card);

    row.appendChild(leftSlot);
    row.appendChild(trunkGap);
    row.appendChild(rightSlot);
    wrap.appendChild(row);
  });

  if (sec.leaves.length === 0) {
    wrap.innerHTML = `<div style="text-align:center;padding:40px 20px;color:#b0985a;font-size:13px;position:relative;z-index:2;">
      Tap <strong>🍃 New Leaf</strong> to add your first task group</div>`;
  }

  setTimeout(drawTreeSVG, 60);
}

function renderLeafBody(bodyEl, leaf, sec) {
  bodyEl.innerHTML = '';

  /* ── Per-body drag state ── */
  let dragId = null;

  function getTodoRows() { return [...bodyEl.querySelectorAll('.leaf-todo')]; }

  function clearIndicators() {
    getTodoRows().forEach(r => r.classList.remove('drop-before','drop-after'));
  }

  function commitDrop(targetRow, position) {
    if (!dragId) return;
    const fromIdx = leaf.todos.findIndex(t=>t.id===dragId);
    if (fromIdx===-1) return;
    const targetId = parseInt(targetRow.dataset.tid);
    let toIdx = leaf.todos.findIndex(t=>t.id===targetId);
    if (toIdx===-1 || fromIdx===toIdx) return;
    const [moved] = leaf.todos.splice(fromIdx, 1);
    toIdx = leaf.todos.findIndex(t=>t.id===targetId);
    const insertAt = position==='before' ? toIdx : toIdx+1;
    leaf.todos.splice(insertAt, 0, moved);
    save();
    dragId = null;
    renderLeafBody(bodyEl, leaf, sec);
  }

  leaf.todos.forEach(todo => {
    const row = document.createElement('div');
    row.className = 'leaf-todo';
    row.dataset.tid = todo.id;
    // propagate CSS var for drop indicators
    row.style.cssText = `--lc:${sec.color}`;

    /* Checkbox */
    const chk = document.createElement('div');
    chk.className = 'leaf-chk' + (todo.done?' done':'');
    if (todo.done) chk.style.background = sec.color;
    chk.addEventListener('click', () => {
      todo.done = !todo.done; save();
      renderLeafBody(bodyEl, leaf, sec);
      const card = bodyEl.closest('.leaf-card');
      const headCount = card.querySelector('.leaf-head-count');
      const pending = leaf.todos.filter(t=>!t.done).length;
      if (headCount) headCount.textContent = pending || '';
      renderSidebar();
      const treeTitleP = document.querySelector('#tree-title p');
      if (treeTitleP) {
        const s2 = activeSec();
        if (s2) treeTitleP.textContent = `${s2.leaves.length} leaf/leaves · ${s2.leaves.reduce((n,l)=>n+l.todos.filter(t=>!t.done).length,0)} tasks remaining`;
      }
    });

    /* Text */
    const txt = document.createElement('div');
    txt.className = 'leaf-todo-txt' + (todo.done?' done':'');
    txt.textContent = todo.text;
    // Double-tap or dblclick to edit
    let taps=0, ttmr=null;
    txt.addEventListener('click', () => {
      taps++; if(taps===1) ttmr=setTimeout(()=>taps=0,350);
      if(taps>=2){clearTimeout(ttmr);taps=0;startEditTodo(txt,todo,leaf,sec,bodyEl);}
    });
    txt.addEventListener('dblclick', () => startEditTodo(txt,todo,leaf,sec,bodyEl));

    /* Delete */
    const del = document.createElement('button');
    del.className = 'leaf-todo-del'; del.textContent = '×';
    del.addEventListener('click', () => {
      leaf.todos = leaf.todos.filter(t=>t.id!==todo.id);
      save(); renderLeafBody(bodyEl, leaf, sec); renderSidebar();
    });

    /* Drag handle */
    const handle = document.createElement('div');
    handle.className = 'leaf-drag-handle';
    handle.textContent = '⠿';
    handle.title = 'Drag to reorder';

    function onDragStart(e) {
      e.stopPropagation();
      if (e.cancelable) e.preventDefault();
      dragId = todo.id;
      row.classList.add('is-dragging');

      function getClientY(ev) { return ev.touches ? ev.touches[0].clientY : ev.clientY; }

      function onMove(ev) {
        if (ev.cancelable) ev.preventDefault();
        clearIndicators();
        const cy = getClientY(ev);
        const rows = getTodoRows();
        for (const r of rows) {
          if (parseInt(r.dataset.tid) === dragId) continue;
          const rect = r.getBoundingClientRect();
          const mid  = rect.top + rect.height / 2;
          if (cy < rect.bottom && cy >= rect.top) {
            r.classList.add(cy < mid ? 'drop-before' : 'drop-after');
            break;
          }
        }
      }

      function onEnd(ev) {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup',   onEnd);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend',  onEnd);
        row.classList.remove('is-dragging');
        // find indicator row and commit
        const before = bodyEl.querySelector('.drop-before');
        const after  = bodyEl.querySelector('.drop-after');
        clearIndicators();
        if (before)     commitDrop(before, 'before');
        else if (after) commitDrop(after,  'after');
        else            dragId = null;
      }

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup',   onEnd);
      document.addEventListener('touchmove', onMove, { passive:false });
      document.addEventListener('touchend',  onEnd);
    }

    handle.addEventListener('mousedown',  onDragStart);
    handle.addEventListener('touchstart', onDragStart, { passive:false });

    row.appendChild(handle);
    row.appendChild(chk);
    row.appendChild(txt);
    row.appendChild(del);
    bodyEl.appendChild(row);
  });

  /* Add row */
  const addRow = document.createElement('div');
  addRow.className = 'leaf-add-row';
  addRow.style.setProperty('--lc', sec.color);
  addRow.innerHTML = `
    <input class="leaf-add-inp" placeholder="Add item…" autocomplete="off"/>
    <button class="leaf-add-btn">+</button>`;
  const addInp = addRow.querySelector('.leaf-add-inp');
  const addBtn = addRow.querySelector('.leaf-add-btn');
  addBtn.style.background = sec.color;
  const doAdd = () => {
    const v = addInp.value.trim(); if (!v) return;
    leaf.todos.push({id:state.nextId++, text:v, done:false});
    addInp.value = ''; save();
    renderLeafBody(bodyEl, leaf, sec);
    const card    = bodyEl.closest('.leaf-card');
    const headCount = card.querySelector('.leaf-head-count');
    const headEl    = card.querySelector('.leaf-head');
    const pending   = leaf.todos.filter(t=>!t.done).length;
    if (headCount) { headCount.textContent = pending; }
    else if (pending>0) {
      const span = document.createElement('span');
      span.className='leaf-head-count'; span.textContent=pending;
      headEl.querySelector('.leaf-rename-btn').before(span);
    }
    renderSidebar();
    setTimeout(()=>{const rows=bodyEl.querySelectorAll('.leaf-todo');rows[rows.length-1]?.scrollIntoView({block:'nearest'});},30);
  };
  addBtn.addEventListener('click', doAdd);
  addInp.addEventListener('keydown', e => { if(e.key==='Enter') doAdd(); });
  bodyEl.appendChild(addRow);
}

function startEditTodo(txtEl, todo, leaf, sec, bodyEl) {
  const inp = document.createElement('input');
  inp.className = 'leaf-todo-txt-inp'; inp.value = todo.text;
  txtEl.replaceWith(inp); inp.focus(); inp.select();
  const done = () => { const v=inp.value.trim(); if(v) todo.text=v; save(); renderLeafBody(bodyEl,leaf,sec); };
  inp.addEventListener('blur', done);
  inp.addEventListener('keydown', e => { if(e.key==='Enter') inp.blur(); if(e.key==='Escape'){inp.value=todo.text;inp.blur();} });
}

function startRenameLeaf(leaf, titleEl, sec) {
  const inp = document.createElement('input');
  inp.className = 'leaf-name-inp'; inp.value = leaf.name;
  const lc = sec.color;
  inp.style.cssText = `--lc-dark:${darken(lc,.35)}`;
  titleEl.replaceWith(inp); inp.focus(); inp.select();
  const done = () => { const v=inp.value.trim(); if(v) leaf.name=v; save(); renderTree(sec); setTimeout(drawTreeSVG,60); };
  inp.addEventListener('blur', done);
  inp.addEventListener('keydown', e => { if(e.key==='Enter') inp.blur(); if(e.key==='Escape'){inp.value=leaf.name;inp.blur();} });
}

/* ── SVG Tree Drawing ── */
function drawTreeSVG() {
  const outer  = document.getElementById('tree-outer');
  const svg    = document.getElementById('tree-svg');
  const titleEl= document.getElementById('tree-title');
  const wrap   = document.getElementById('leaves-wrap');
  if (!outer || !svg) return;

  const W = outer.offsetWidth;
  const H = outer.scrollHeight;
  const cx = W / 2;

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);

  const outerBCR = outer.getBoundingClientRect();

  // Trunk extents
  const trunkTop = titleEl ? (titleEl.getBoundingClientRect().bottom - outerBCR.top) + 4 : 60;
  const trunkBot = H - 52;
  const trunkW   = 48;
  const mid      = trunkBot - trunkTop;

  // Organic trunk bezier
  const trunkD = `M ${cx} ${trunkTop}
    C ${cx-7} ${trunkTop+mid*.2} ${cx+7} ${trunkTop+mid*.4}
      ${cx} ${trunkTop+mid*.6}
    C ${cx-5} ${trunkTop+mid*.75} ${cx+5} ${trunkTop+mid*.88}
      ${cx} ${trunkBot}`;

  // Branches — start from trunk edge, not centre
  const sec = activeSec();
  let branches = '';
  if (sec && wrap) {
    const trunkEdgeL = cx - trunkW / 2;
    const trunkEdgeR = cx + trunkW / 2;
    const rows = wrap.querySelectorAll('.leaf-row');
    rows.forEach(row => {
      const card = row.querySelector('.leaf-card');
      if (!card) return;
      const rowBCR  = row.getBoundingClientRect();
      const cardBCR = card.getBoundingClientRect();
      const brY     = rowBCR.top - outerBCR.top + rowBCR.height / 2;
      const isLeft  = row.classList.contains('left');
      const trunkEdge = isLeft ? trunkEdgeL : trunkEdgeR;
      const cardEdge  = isLeft ? cardBCR.right - outerBCR.left : cardBCR.left - outerBCR.left;
      const cp1x = isLeft ? trunkEdge - 16 : trunkEdge + 16;
      const cp2x = isLeft ? cardEdge  + 12 : cardEdge  - 12;
      branches += `<path d="M ${trunkEdge} ${brY} C ${cp1x} ${brY} ${cp2x} ${brY} ${cardEdge} ${brY}"
        fill="none" stroke="#8b6030" stroke-width="2.8" stroke-linecap="round"/>`;
    });
  }

  // Keywords along trunk
  let kwSVG = '';
  if (sec && sec.keywords && sec.keywords.length) {
    const kws = sec.keywords;
    const slots = kws.length + 1;
    kwSVG += `<defs><path id="trunk-kw-path" d="${trunkD}"/></defs>`;
    kws.forEach((kw, i) => {
      const offset = Math.round(8 + ((i + 1) / slots) * 82);
      // alternate above/below trunk centreline, staying within the bark width
      const dy = i % 2 === 0 ? -7 : 10;
      kwSVG += `
        <text font-size="13" font-family="-apple-system,sans-serif"
              font-weight="800" letter-spacing="0.08em"
              fill="#f5d48a" opacity="0.95">
          <textPath href="#trunk-kw-path" startOffset="${offset}%" text-anchor="middle">
            <tspan dy="${dy}">${escSVG(kw.toUpperCase())}</tspan>
          </textPath>
        </text>`;
    });
  }

  // Roots
  const rb = trunkBot;
  const roots = `
    <path d="M ${cx} ${rb} C ${cx-10} ${rb+10} ${cx-42} ${rb+18} ${cx-58} ${rb+36}" fill="none" stroke="#4a2e14" stroke-width="16" stroke-linecap="round"/>
    <path d="M ${cx} ${rb} C ${cx+10} ${rb+10} ${cx+42} ${rb+18} ${cx+58} ${rb+36}" fill="none" stroke="#4a2e14" stroke-width="16" stroke-linecap="round"/>
    <path d="M ${cx} ${rb+6} C ${cx-4} ${rb+16} ${cx-14} ${rb+28} ${cx-12} ${rb+42}" fill="none" stroke="#4a2e14" stroke-width="10" stroke-linecap="round"/>
    <path d="M ${cx} ${rb+6} C ${cx+4} ${rb+16} ${cx+14} ${rb+28} ${cx+12} ${rb+42}" fill="none" stroke="#4a2e14" stroke-width="10" stroke-linecap="round"/>`;

  const ground = `<ellipse cx="${cx}" cy="${rb+44}" rx="70" ry="10" fill="#c8a070" opacity="0.35"/>`;

  // Wide invisible hit area on trunk for tap-to-edit
  const trunkHit = `<path id="trunk-hit" d="${trunkD}" fill="none" stroke="transparent"
    stroke-width="60" stroke-linecap="round" style="cursor:pointer;"/>`;

  svg.innerHTML = `
    <path d="${trunkD}" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="${trunkW+6}" stroke-linecap="round"/>
    <path d="${trunkD}" fill="none" stroke="#5c3318" stroke-width="${trunkW}" stroke-linecap="round"/>
    <path d="${trunkD}" fill="none" stroke="#8b5430" stroke-width="${trunkW*.28}" stroke-linecap="round" opacity="0.5"/>
    ${kwSVG}
    ${branches}
    ${roots}
    ${ground}
    ${trunkHit}`;

  // Bind trunk tap
  const hitEl = svg.getElementById('trunk-hit');
  if (hitEl) {
    hitEl.addEventListener('click',  openKwPanel);
    hitEl.addEventListener('touchend', e => { e.preventDefault(); openKwPanel(e); });
  }
}

/* ── Add leaf / section ── */
addLeafBtn.addEventListener('click', () => {
  const sec = activeSec(); if (!sec) return;
  const leaf = { id: state.nextId++, name: 'New leaf', todos: [] };
  sec.leaves.push(leaf);
  save(); renderTree(sec); renderSidebar();
  setTimeout(() => {
    // Auto-focus new leaf name
    const cards = document.querySelectorAll('.leaf-card');
    const lastCard = cards[cards.length-1];
    if (lastCard) {
      lastCard.scrollIntoView({ behavior:'smooth', block:'center' });
      setTimeout(() => {
        const titleEl = lastCard.querySelector('.leaf-head-title');
        if (titleEl) startRenameLeaf(leaf, titleEl, sec);
      }, 200);
    }
    drawTreeSVG();
  }, 60);
});

document.getElementById('add-sec-btn').addEventListener('click', () => {
  const color = SEC_COLORS[state.sections.length % SEC_COLORS.length];
  const sec = { id: state.nextId++, name: 'New tree', color, leaves: [] };
  state.sections.push(sec); state.activeId = sec.id;
  save(); render();
  setTimeout(() => {
    const items = secListEl.querySelectorAll('.sec-item');
    const last  = items[items.length-1];
    if (last) startRenameSec(sec.id, last);
  }, 40);
});

/* ── Keyword panel ── */
const kwPanel  = document.getElementById('kw-panel');
const kwChips  = document.getElementById('kw-chips');
const kwInp    = document.getElementById('kw-inp');
const kwAddBtn = document.getElementById('kw-add-btn');
const kwClose  = document.getElementById('kw-close');

function openKwPanel(e) {
  const sec = activeSec(); if (!sec) return;
  // Position panel near trunk centre
  const svg = document.getElementById('tree-svg');
  const r   = svg ? svg.getBoundingClientRect() : {left:0,top:0,width:200};
  const cx  = r.left + r.width / 2;
  const panW = 220;
  let left = cx - panW / 2;
  if (left < 6) left = 6;
  if (left + panW > window.innerWidth - 6) left = window.innerWidth - panW - 6;
  kwPanel.style.left = left + 'px';
  kwPanel.style.top  = Math.min(r.top + 80, window.innerHeight - 280) + 'px';
  kwPanel.style.display = 'block';
  renderKwChips(sec);
  kwInp.value = '';
  kwInp.focus();
}

function renderKwChips(sec) {
  kwChips.innerHTML = '';
  (sec.keywords||[]).forEach((kw, i) => {
    const chip = document.createElement('div');
    chip.className = 'kw-chip';
    chip.innerHTML = `${esc(kw)}<button class="kw-chip-del" title="Remove">×</button>`;
    chip.querySelector('.kw-chip-del').addEventListener('click', () => {
      sec.keywords.splice(i, 1);
      save(); renderKwChips(sec); drawTreeSVG();
    });
    kwChips.appendChild(chip);
  });
  if (!sec.keywords.length) {
    kwChips.innerHTML = '<span style="font-size:11px;color:#4a3018;font-style:italic;">No keywords yet</span>';
  }
}

function addKeyword() {
  const sec = activeSec(); if (!sec) return;
  const v = kwInp.value.trim();
  if (!v) return;
  if (!sec.keywords) sec.keywords = [];
  if (sec.keywords.length >= 6) return; // max 6 keywords on trunk
  if (!sec.keywords.includes(v)) sec.keywords.push(v);
  kwInp.value = '';
  save(); renderKwChips(sec); drawTreeSVG();
}

kwAddBtn.addEventListener('click', addKeyword);
kwInp.addEventListener('keydown', e => { if (e.key==='Enter') addKeyword(); });
kwClose.addEventListener('click', () => kwPanel.style.display='none');

// Close on outside click
document.addEventListener('click', e => {
  if (kwPanel.style.display==='block' && !e.target.closest('#kw-panel') && !e.target.closest('#trunk-hit')) {
    kwPanel.style.display = 'none';
  }
});

/* ── Helpers ── */
function escSVG(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── Sidebar toggle ── */
document.getElementById('menu-btn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
  setTimeout(drawTreeSVG, 240);
});

/* ── Redraw SVG on resize ── */
window.addEventListener('resize', () => setTimeout(drawTreeSVG, 50));
document.getElementById('main').addEventListener('scroll', drawTreeSVG);

/* ── Helpers ── */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Auth UI ── */
function showAuthOverlay() { document.getElementById('auth-overlay').classList.remove('hidden'); }
function hideAuthOverlay() { document.getElementById('auth-overlay').classList.add('hidden'); }

function setUserUI(user) {
  const btn = document.getElementById('user-btn');
  const avatar = document.getElementById('user-avatar');
  const name = document.getElementById('user-name');
  if (user) {
    btn.classList.add('visible');
    name.textContent = user.displayName?.split(' ')[0] || 'You';
    if (user.photoURL) {
      avatar.innerHTML = `<img src="${user.photoURL}" referrerpolicy="no-referrer"/>`;
    } else {
      document.getElementById('user-initial').textContent =
        (user.displayName || user.email || '?')[0].toUpperCase();
    }
  } else {
    btn.classList.remove('visible');
  }
}

function normaliseState() {
  if (!state.activeId && state.sections.length) state.activeId = state.sections[0].id;
  state.sections.forEach(s => { if (!s.keywords) s.keywords = []; });
  if (!state.visionBoard)  state.visionBoard  = { keywords: [] };
  if (!state.activeView)   state.activeView   = 'tree';
  if (state.pinnedLeafId === undefined) state.pinnedLeafId = null;
  state.visionBoard.keywords.forEach(k => { if (!k.content) k.content = ''; });
}

async function bootAsGuest() {
  hideAuthOverlay();
  currentUser = null;
  setUserUI(null);
  const raw = await storageGet() || localStorage.getItem(STORE_KEY);
  try { const s = JSON.parse(raw||'null'); if(s&&s.sections) state=s; else seed(); } catch(e) { seed(); }
  normaliseState(); render();
}

async function bootAsUser(user) {
  hideAuthOverlay();
  currentUser = user;
  setUserUI(user);
  setSyncDot('syncing');
  const raw = await storageGet();
  try { const s = JSON.parse(raw||'null'); if(s&&s.sections) state=s; else seed(); } catch(e) { seed(); }
  normaliseState(); setSyncDot(''); render();
}

function initAuth() {
  // ── Sign in with Google popup ──
  document.getElementById('auth-google-btn').addEventListener('click', async () => {
    document.getElementById('auth-error').textContent = '';
    try {
      const { auth, provider, signInWithPopup } = window._fb;
      const result = await signInWithPopup(auth, provider);
      if (result?.user) {
        localStorage.removeItem('treelist_guest_mode');
        await bootAsUser(result.user);
      }
    } catch(e) {
      if (e.code !== 'auth/popup-closed-by-user') {
        document.getElementById('auth-error').textContent = 'Sign-in failed. Try again.';
      }
    }
  });

  // ── Guest mode ──
  document.getElementById('auth-guest-btn').addEventListener('click', () => {
    localStorage.setItem('treelist_guest_mode', '1');
    bootAsGuest();
  });

  // ── Sign out ──
  document.getElementById('user-btn').addEventListener('click', async () => {
    if (!confirm('Sign out of TreeList?')) return;
    const { auth, signOut } = window._fb;
    await signOut(auth);
    currentUser = null; setUserUI(null); setSyncDot('');
    state = { sections:[], activeId:null, nextId:1, activeView:'tree', visionBoard:{ keywords:[] } };
    showAuthOverlay();
  });

// ── Watch auth state (handles page refresh / already signed in) ──
  const { auth, onAuthStateChanged } = window._fb;
  let booted = false;
  onAuthStateChanged(auth, async user => {
    if (booted) return;
    booted = true;
    if (user) {
      localStorage.removeItem('treelist_guest_mode');
      await bootAsUser(user);
    } else {
      localStorage.getItem('treelist_guest_mode') === '1'
        ? await bootAsGuest()
        : showAuthOverlay();
    }
  });
}
// Wait for Firebase SDK, fall back to guest if unavailable
if (window._fb) { initAuth(); }
else {
  document.addEventListener('fb-ready', initAuth, { once: true });
  setTimeout(() => { if (!window._fb) bootAsGuest(); }, 4000);
}
})();
</script>
